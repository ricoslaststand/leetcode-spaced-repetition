basePath: /
definitions:
  controllers.saveProblemSubmissionRequest:
    properties:
      confidenceLevel:
        type: string
      language:
        type: string
      problemId:
        minimum: 1
        type: integer
      timeTaken:
        type: integer
    required:
    - confidenceLevel
    - problemId
    type: object
  models.ConfidenceLevel:
    enum:
    - again
    - hard
    - good
    - easy
    type: string
    x-enum-varnames:
    - AgainConfidence
    - HardConfidence
    - GoodConfidence
    - EasyConfidence
  models.DashboardData:
    properties:
      due:
        items:
          $ref: '#/definitions/models.ProblemReviewItem'
        type: array
      lowStability:
        items:
          $ref: '#/definitions/models.ProblemReviewItem'
        type: array
      overdueCount:
        type: integer
    type: object
  models.ImportSubmissionRowError:
    properties:
      reason:
        type: string
      row:
        type: integer
    type: object
  models.ImportSubmissionsResult:
    properties:
      errors:
        items:
          $ref: '#/definitions/models.ImportSubmissionRowError'
        type: array
      imported:
        type: integer
      skipped:
        type: integer
    type: object
  models.Problem:
    properties:
      description:
        type: string
      difficulty:
        $ref: '#/definitions/models.ProblemDifficulty'
      id:
        type: integer
      slug:
        type: string
      title:
        type: string
      topics:
        items:
          type: string
        type: array
    type: object
  models.ProblemDetail:
    properties:
      description:
        type: string
      difficulty:
        $ref: '#/definitions/models.ProblemDifficulty'
      id:
        type: integer
      slug:
        type: string
      stability:
        type: number
      title:
        type: string
      topics:
        items:
          type: string
        type: array
    type: object
  models.ProblemDifficulty:
    enum:
    - easy
    - medium
    - hard
    type: string
    x-enum-varnames:
    - EasyDifficulty
    - MediumDifficulty
    - HardDifficulty
  models.ProblemPage:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Problem'
        type: array
    required:
    - data
    type: object
  models.ProblemReviewItem:
    properties:
      difficulty:
        $ref: '#/definitions/models.ProblemDifficulty'
      due:
        type: string
      problemId:
        type: integer
      slug:
        type: string
      stability:
        type: number
      title:
        type: string
    type: object
  models.ProblemSubmission:
    properties:
      confidenceLevel:
        $ref: '#/definitions/models.ConfidenceLevel'
      date:
        type: string
      id:
        type: string
      language:
        $ref: '#/definitions/models.SubmissionLanguage'
      problemId:
        type: integer
      timeTaken:
        type: integer
    type: object
  models.ProblemSubmissionPage:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ProblemSubmission'
        type: array
    required:
    - data
    type: object
  models.ProblemSubmissionWithDetails:
    properties:
      confidenceLevel:
        $ref: '#/definitions/models.ConfidenceLevel'
      id:
        type: string
      problem:
        properties:
          description:
            type: string
          difficulty:
            $ref: '#/definitions/models.ProblemDifficulty'
          id:
            type: integer
          title:
            type: string
        type: object
      submittedAt:
        type: string
      timeTaken:
        type: integer
    type: object
  models.ProblemSubmissionWithDetailsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ProblemSubmissionWithDetails'
        type: array
    required:
    - data
    type: object
  models.SubmissionLanguage:
    enum:
    - cpp
    - java
    - python
    - python3
    - c
    - csharp
    - javascript
    - typescript
    - php
    - swift
    - kotlin
    - dart
    - golang
    - ruby
    - scala
    - rust
    - racket
    - erlang
    - elixir
    type: string
    x-enum-varnames:
    - LangCPP
    - LangJava
    - LangPython
    - LangPython3
    - LangC
    - LangCSharp
    - LangJavaScript
    - LangTypeScript
    - LangPHP
    - LangSwift
    - LangKotlin
    - LangDart
    - LangGolang
    - LangRuby
    - LangScala
    - LangRust
    - LangRacket
    - LangErlang
    - LangElixir
host: localhost:8000
info:
  contact: {}
  description: A spaced repetition API for tracking Leetcode practice sessions.
  title: Leetcode Buddy API
  version: "1.0"
paths:
  /dashboard:
    get:
      description: Returns problems due for review and problems with the lowest FSRS
        stability
      parameters:
      - description: Number of items per table (1–50, default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DashboardData'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dashboard summary
      tags:
      - dashboard
  /problems:
    get:
      description: Returns a paginated list of Leetcode problems, optionally filtered
        by topics
      parameters:
      - collectionFormat: csv
        description: Filter by topic names
        in: query
        items:
          type: string
        name: topics
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProblemPage'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List problems
      tags:
      - problems
  /problems/{id}:
    get:
      description: Returns a single problem including its topics
      parameters:
      - description: Problem ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProblemDetail'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a problem by ID
      tags:
      - problems
  /problems/{id}/submissions:
    get:
      description: Returns all submissions for the problem identified by id
      parameters:
      - description: Problem ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProblemSubmissionPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get submissions for a problem
      tags:
      - problems
  /problems/submissions:
    get:
      description: Returns submissions across all problems, optionally filtered by
        problem IDs
      parameters:
      - collectionFormat: csv
        description: Filter by problem IDs
        in: query
        items:
          type: integer
        name: problemId
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProblemSubmissionWithDetailsPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all submissions
      tags:
      - submissions
    post:
      consumes:
      - application/json
      description: Saves a new attempt for a Leetcode problem
      parameters:
      - description: Submission details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.saveProblemSubmissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record a new submission
      tags:
      - submissions
  /problems/submissions/import:
    post:
      consumes:
      - multipart/form-data
      description: 'Accepts a multipart/form-data .xlsx file and bulk-imports problem
        submissions. Each row must have columns: "Problem #", "Date" (YYYY-MM-DD),
        "Confidence" (1-4), "Language" (python only).'
      parameters:
      - description: Excel file (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ImportSubmissionsResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import submissions from Excel
      tags:
      - submissions
  /problems/topics:
    get:
      description: Returns every topic that exists across all problems
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all problem topics
      tags:
      - problems
swagger: "2.0"
