# LOCAL DEVELOPMENT ONLY. Do not deploy this file.
#
# It publishes Postgres on 5432, Adminer on 8080, and the API on 8000 with a weak database
# password. In production the API must be reachable only on Traefik's internal network —
# publishing its port bypasses Authelia's ForwardAuth and removes authentication entirely.
services:
  db:
    container_name: leetcode-buddy-postgres
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-network
 
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - app-network
  
  app:
    container_name: leetcode-buddy-app-frontend
    build:
      dockerfile: Dockerfile.dev
      context: ./frontend/
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # The Vite dev proxy stands in for Traefik; from inside this container the API is
      # reachable by service name, not localhost. See frontend/vite.config.ts.
      - VITE_DEV_API_TARGET=http://api:8000
      - VITE_DEV_OWNER_USERNAME=dev-owner
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - 5173:5173
    networks:
      - app-network
    restart: unless-stopped


  api:
    container_name: leetcode-buddy-app-api
    build:
      dockerfile: Dockerfile
      context: ./
    ports:
      - 8000:8000
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - app-network
    restart: always

  # db-seeding:
  #   build:
  #     dockerfile: Dockerfile.data-seeding
  #     context: ./
  #   depends_on:
  #     - db
  #   networks:
  #     - app-network
  #   restart: "no"
 
networks:
  app-network:
    driver: bridge

volumes:
  pgdata: